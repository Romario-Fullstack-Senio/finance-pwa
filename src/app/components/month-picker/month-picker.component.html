<div class="flex flex-wrap items-center gap-x-3 gap-y-2">
  <div class="flex items-center gap-1">
    <button
      type="button"
      class="grid h-10 w-10 place-items-center rounded-full text-slate-300 transition hover:bg-slate-800 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300"
      [attr.aria-label]="'Ver ' + previousName()"
      (click)="move(-1)"
    >
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path
          fill-rule="evenodd"
          d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>

    <h2 class="relative">
      <button
        type="button"
        class="rounded-lg px-1 text-3xl font-extrabold tracking-tight text-white transition hover:text-indigo-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 sm:text-4xl"
        (click)="openPicker()"
      >
        {{ name() }} <span class="font-normal text-slate-400">{{ year() }}</span
        ><span class="sr-only">, elegir otro mes</span>
      </button>
      <input
        #nativePicker
        type="month"
        tabindex="-1"
        aria-hidden="true"
        class="pointer-events-none absolute inset-x-0 bottom-0 h-0 w-full opacity-0"
        [value]="selected()"
        (change)="onPicked(nativePicker.value)"
      />
    </h2>

    <button
      type="button"
      class="grid h-10 w-10 place-items-center rounded-full text-slate-300 transition hover:bg-slate-800 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300"
      [attr.aria-label]="'Ver ' + nextName()"
      (click)="move(1)"
    >
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path
          fill-rule="evenodd"
          d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>

  @if (!isCurrent()) {
    <button type="button" class="btn-ghost" (click)="goToCurrent()">Ir al mes actual</button>
  }
</div>
