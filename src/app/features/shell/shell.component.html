<div class="mx-auto w-full max-w-7xl px-4 pb-28 pt-5 sm:px-6 md:pb-12 lg:px-8">
  @if (loading()) {
    <div class="grid min-h-[70vh] place-content-center text-center text-slate-300" role="status">
      <div
        class="mx-auto mb-4 h-10 w-10 animate-spin rounded-full border-4 border-slate-700 border-t-indigo-400"
        aria-hidden="true"
      ></div>
      <p class="text-lg font-semibold">Cargando tus finanzas…</p>
    </div>
  } @else {
    <div class="flex flex-wrap items-center gap-3">
      <div class="min-w-0 flex-1">
        <app-shell-header />
      </div>
      <button type="button" class="btn-ghost" (click)="exportCsv()">Exportar CSV</button>
    </div>

    <div class="mt-8 flex flex-wrap items-center justify-between gap-4">
      <app-month-picker />

      <nav aria-label="Secciones" class="hidden md:block">
        <ul class="flex gap-1 rounded-xl border p-1" style="border-color: var(--hairline)">
          @for (tab of tabs; track tab.path) {
            <li>
              <a
                [routerLink]="tab.path"
                routerLinkActive="bg-slate-800 !text-white"
                ariaCurrentWhenActive="page"
                class="block rounded-lg px-4 py-2 text-sm font-medium text-slate-400 transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300"
              >
                {{ tab.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <main class="mt-6">
      <router-outlet />
    </main>

    <!-- Navegación inferior en móvil -->
    <nav
      aria-label="Secciones"
      class="fixed inset-x-0 bottom-0 z-30 border-t bg-slate-950/95 backdrop-blur md:hidden"
      style="border-color: var(--hairline); padding-bottom: env(safe-area-inset-bottom)"
    >
      <ul class="grid grid-cols-3">
        @for (tab of tabs; track tab.path) {
          <li>
            <a
              [routerLink]="tab.path"
              routerLinkActive="!text-white"
              ariaCurrentWhenActive="page"
              class="flex flex-col items-center gap-1 py-2.5 text-xs font-medium text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-300"
            >
              <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
                <path fill-rule="evenodd" clip-rule="evenodd" [attr.d]="tab.icon" />
              </svg>
              {{ tab.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</div>
