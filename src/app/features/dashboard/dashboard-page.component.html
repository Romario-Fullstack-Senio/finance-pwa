@if (hasMovements()) {
  <p class="max-w-3xl text-lg leading-relaxed text-slate-300">{{ verdict() }}</p>
} @else {
  <div class="flex flex-wrap items-center gap-4">
    <p class="text-lg text-slate-300">Todavía no hay movimientos este mes.</p>
    <a routerLink="/movimientos" class="btn-primary">Registrar movimiento</a>
  </div>
}

<div class="mt-6 space-y-5">
  <app-month-summary class="block" />

  <div class="grid gap-5 xl:grid-cols-[minmax(0,5fr)_minmax(0,4fr)]">
    <app-rule-card class="block" />
    <app-category-breakdown-chart class="block" />
  </div>

  <app-income-expense-chart class="block" />
  <app-savings-trend-chart class="block" />
</div>
