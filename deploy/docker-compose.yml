# Stack de producción de Finance PWA: Postgres + API (Fastify) + web (Caddy con la PWA).
# Solo `web` publica un puerto, y únicamente en 127.0.0.1: Tailscale Funnel lo expone
# a internet con HTTPS. Postgres y la API solo son accesibles dentro de la red interna.
#
# Uso (desde la raíz del repo, con deploy/.env creado — ver deploy/.env.example):
#   npm run build && docker compose -f deploy/docker-compose.yml up -d --build
name: finance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  api:
    build: ../server
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://finance:${POSTGRES_PASSWORD}@db:5432/finance
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en deploy/.env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      TRUST_PROXY: ${TRUST_PROXY:-2}
    volumes:
      - avatars:/data/avatars
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    volumes:
      - avatars:/srv/avatars:ro
    networks:
      - internal

volumes:
  db_data:
  avatars:

networks:
  internal:
